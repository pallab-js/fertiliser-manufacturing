name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Migrate test DB
        run: npm run db:migrate
        env:
          NOTER_DB: ${{ runner.temp }}/noter-test.db

      - name: Seed test DB
        run: npm run db:seed
        env:
          NOTER_DB: ${{ runner.temp }}/noter-test.db

      - name: Run db:check
        run: npm run db:check
        env:
          NOTER_DB: ${{ runner.temp }}/noter-test.db